<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- SEO & GOOGLE SEARCH TAGS -->
    <title>Prominator | AI Mobile Web Architect</title>
    <meta name="description" content="Professional AI Prompt Architect for building high-end mobile websites instantly.">
    <meta name="keywords" content="AI, Prompt Engineering, Web Architect, Mobile Builder, Prominator">
    <meta name="author" content="Prominator Engine">
    <link rel="canonical" href="https://prominator.architect">
    
    <!-- OPEN GRAPH (Social Media SEO) -->
    <meta property="og:title" content="Prominator AI Architect">
    <meta property="og:description" content="Generate master-level mobile website prompts.">
    <meta property="og:image" content="https://cdn-icons-png.flaticon.com/512/2103/2103633.png">
    <meta property="og:type" content="website">

    <!-- PWA / MOBILE APP SETTINGS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0F0E13">
    
    <!-- APP LOGO (URL of choice) -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2103/2103633.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2103/2103633.png">

    <!-- WEB MANIFEST (Makes it installable as an app) -->
    <link rel="manifest" href='data:application/json,{"name":"Prominator","short_name":"Prominator","start_url":".","display":"standalone","background_color":"#0F0E13","theme_color":"#0F0E13","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2103/2103633.png","sizes":"512x512","type":"image/png"}]}'>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0F0E13;
            color: #E6E1E5;
            margin: 0;
            overflow-x: hidden;
        }

        /* GOOGLE LOADING SCREEN */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease-out, visibility 0.5s;
        }

        .google-dots {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .dot {
            width: 15px; height: 15px; border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .dot:nth-child(1) { background: #4285F4; animation-delay: -0.32s; }
        .dot:nth-child(2) { background: #EA4335; animation-delay: -0.16s; }
        .dot:nth-child(3) { background: #FBBC05; animation-delay: -0.08s; }
        .dot:nth-child(4) { background: #34A853; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* APP STYLES */
        .glass-card {
            background: rgba(28, 27, 31, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 30px;
        }

        .input-box {
            background: #232127;
            border-radius: 18px;
            padding: 15px;
            border: 2px solid transparent;
            transition: 0.3s;
        }

        .input-box:focus-within {
            border-color: #D0BCFF;
            box-shadow: 0 0 15px rgba(208, 188, 255, 0.2);
        }

        .cta-btn {
            background: linear-gradient(135deg, #D0BCFF 0%, #9370DB 100%);
            color: #1C1B1F;
            font-weight: 800;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        #toast {
            visibility: hidden;
            background: #D0BCFF;
            color: #1C1B1F;
            padding: 12px 25px;
            border-radius: 50px;
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: bold;
            z-index: 1000;
        }

        #toast.show { visibility: visible; animation: slideUp 0.3s forwards; }

        @keyframes slideUp { from { bottom: 0; opacity: 0; } to { bottom: 40px; opacity: 1; } }
    </style>
</head>
<body class="pb-10">

    <!-- GOOGLE SPLASH SCREEN -->
    <div id="splash-screen">
        <div class="google-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <p style="color: #5f6368; font-weight: 500; font-size: 14px; letter-spacing: 1px;">PROMINATOR</p>
    </div>

    <!-- MAIN APP CONTENT -->
    <header class="p-6 flex justify-between items-center sticky top-0 bg-[#0F0E13]/90 backdrop-blur-lg z-50">
        <div>
            <h1 class="text-2xl font-black text-white">PROMINATOR</h1>
            <p class="text-[10px] text-[#D0BCFF] font-bold tracking-[3px]">APP ENGINE v5.0</p>
        </div>
        <button onclick="toggleSettings()" class="w-12 h-12 rounded-2xl bg-[#1C1B1F] flex items-center justify-center border border-white/10">
            <i class="fas fa-bars text-[#D0BCFF]"></i>
        </button>
    </header>

    <main class="px-5 mt-4 space-y-6">
        <div class="glass-card p-6 space-y-5">
            <div>
                <label class="text-[11px] font-bold text-[#D0BCFF] uppercase mb-2 block tracking-widest">Your Idea</label>
                <div class="input-box">
                    <textarea id="websiteIdea" rows="3" class="w-full bg-transparent border-none outline-none text-white text-base" placeholder="Describe your mobile site..."></textarea>
                </div>
            </div>

            <div>
                <label class="text-[11px] font-bold text-[#D0BCFF] uppercase mb-2 block tracking-widest">Custom Constraints</label>
                <div class="input-box">
                    <textarea id="userConstraints" rows="2" class="w-full bg-transparent border-none outline-none text-white text-base" placeholder="Colors, specific tabs, fonts..."></textarea>
                </div>
            </div>

            <button onclick="generatePrompt()" id="mainBtn" class="cta-btn w-full py-5 flex items-center justify-center gap-3 active:scale-95 transition-transform">
                <span id="btnText">CONSTRUCT MOBILE PROMPT</span>
                <div id="loader" class="hidden w-5 h-5 border-2 border-[#1C1B1F] border-t-transparent rounded-full animate-spin"></div>
            </button>
        </div>

        <div id="outputContainer" class="hidden">
            <div class="glass-card overflow-hidden border-[#D0BCFF]/30 border">
                <div class="px-5 py-3 bg-[#D0BCFF]/10 flex justify-between items-center border-b border-white/5">
                    <span class="text-[10px] font-black uppercase text-[#D0BCFF]">Ready for Mobile Coding</span>
                    <button onclick="copyToClipboard()" class="text-[#D0BCFF] text-xs font-bold"><i class="far fa-copy"></i> COPY</button>
                </div>
                <textarea id="resultText" readonly class="w-full h-80 p-5 font-mono text-[12px] leading-relaxed text-gray-300 bg-transparent outline-none"></textarea>
            </div>
        </div>
    </main>

    <!-- SETTINGS / HISTORY SLIDE-UP -->
    <div id="settingsOverlay" class="fixed inset-0 bg-[#0F0E13] z-[60] p-6 transition-transform duration-500 translate-y-full flex flex-col">
        <div class="flex items-center justify-between mb-8">
            <button onclick="toggleSettings()" class="text-2xl text-white"><i class="fas fa-chevron-down"></i></button>
            <h2 class="text-xl font-bold">App Settings</h2>
            <button onclick="clearLogs()" class="text-red-400 text-xs font-bold">CLEAR DATA</button>
        </div>
        
        <div class="glass-card p-5 mb-6">
            <label class="text-xs font-bold text-[#D0BCFF] mb-3 block">OpenRouter Model ID</label>
            <div class="input-box">
                <input type="text" id="customModel" class="w-full bg-transparent outline-none text-white">
            </div>
        </div>

        <h3 class="font-bold text-sm text-[#D0BCFF] mb-4 uppercase tracking-widest">Recent Logs</h3>
        <div id="historyList" class="space-y-3 flex-1 overflow-y-auto"></div>
    </div>

    <div id="toast">Copied to clipboard!</div>

    <script>
        // API Configuration
        const _k = "c2stb3ItdjEtYjE1YTYwNzA4ZDcwNWE3NzkxNzJjZDY3ZWI3NTkzYjM5MTBhZmVjMWY5NDY4MWFlYWQ0YzdhOWNiZjgzMmRhZQ==";

        // SPLASH SCREEN LOGIC
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.visibility = 'hidden', 500);
            }, 2000); // Show for 2 seconds

            document.getElementById('customModel').value = localStorage.getItem('app_model') || "anthropic/claude-3.5-sonnet";
            renderHistory();
        });

        // SERVICE WORKER REGISTRATION (For PWA Install)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('data:text/javascript;base64,c2VsZi5hZGRFdmVudExpc3RlbmVyKCdmZXRjaCcsIGV2ZW50ID0+IHsgfSk7').catch(() => {});
            });
        }

        function toggleSettings() {
            document.getElementById('settingsOverlay').classList.toggle('translate-y-full');
        }

        async function generatePrompt() {
            const idea = document.getElementById('websiteIdea').value;
            const rules = document.getElementById('userConstraints').value;
            const model = document.getElementById('customModel').value;

            if(!idea) return showToast("Please describe your idea!");

            localStorage.setItem('app_model', model);
            const btn = document.getElementById('mainBtn');
            const loader = document.getElementById('loader');
            const btnText = document.getElementById('btnText');

            btn.disabled = true;
            loader.classList.remove('hidden');
            btnText.innerText = "ENGINEERING...";

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${atob(_k)}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": model,
                        "messages": [
                            {
                                "role": "system",
                                "content": "You are a World-Class HTML Web Architect. Create a powerful 'Meta-Prompt' for a single-file HTML website. The prompt you generate must instruct another AI to use: Tailwind CSS, Google Fonts, and FontAwesome. Focus on high-end mobile UI."
                            },
                            {
                                "role": "user",
                                "content": `Build a detailed architect prompt for: ${idea}. Rules: ${rules}`
                            }
                        ]
                    })
                });

                const data = await response.json();
                let result = data.choices[0].message.content;

                // Add the requested automatic instruction
                const finalPrompt = result + "\n\ncreate the HTML code for mobile in one code block";

                document.getElementById('resultText').value = finalPrompt;
                document.getElementById('outputContainer').classList.remove('hidden');
                
                saveLog(idea, finalPrompt);
                showToast("Architecture Constructed!");

            } catch (err) {
                alert("Engine Error: " + err.message);
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
                btnText.innerText = "CONSTRUCT MOBILE PROMPT";
            }
        }

        function saveLog(idea, prompt) {
            let logs = JSON.parse(localStorage.getItem('app_logs') || '[]');
            logs.unshift({ idea, prompt, date: new Date().toLocaleTimeString() });
            localStorage.setItem('app_logs', JSON.stringify(logs.slice(0, 10)));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const logs = JSON.parse(localStorage.getItem('app_logs') || '[]');
            list.innerHTML = logs.map((log, i) => `
                <div class="bg-white/5 p-4 rounded-2xl flex justify-between items-center border border-white/5" onclick="loadLog(${i})">
                    <p class="text-sm font-semibold truncate flex-1 text-gray-300">${log.idea}</p>
                    <i class="fas fa-chevron-right text-white/20 ml-3"></i>
                </div>
            `).join('');
        }

        function loadLog(i) {
            const logs = JSON.parse(localStorage.getItem('app_logs') || '[]');
            document.getElementById('websiteIdea').value = logs[i].idea;
            document.getElementById('resultText').value = logs[i].prompt;
            document.getElementById('outputContainer').classList.remove('hidden');
            toggleSettings();
            showToast("Log Loaded");
        }

        function copyToClipboard() {
            const area = document.getElementById('resultText');
            area.select();
            navigator.clipboard.writeText(area.value);
            showToast("Copied to clipboard!");
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 3000);
        }

        function clearLogs() {
            if(confirm("Wipe all locally stored logs?")) {
                localStorage.removeItem('app_logs');
                renderHistory();
            }
        }
    </script>
</body>
</html>
