<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PRIMARY SEO TAGS (Google Search Friendly) -->
    <title>Prominator AI | Professional Mobile Prompt Architect</title>
    <meta name="description" content="Prominator is the world's most advanced AI tool for generating high-end mobile website prompts. Build master-level HTML/Tailwind sites instantly.">
    <meta name="keywords" content="AI Prompt Generator, Mobile Web Architect, Prominator AI, Tailwind CSS Builder, AI Web Design">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://your-domain.com/">

    <!-- OPEN GRAPH (Social Media) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Prominator AI Architect">
    <meta property="og:description" content="Generate master-level mobile website prompts with AI.">
    <meta property="og:image" content="https://cdn-icons-png.flaticon.com/512/2103/2103633.png">
    <meta property="og:url" content="https://your-domain.com/">

    <!-- SCHEMA.ORG (Google Structured Data) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Prominator AI",
      "operatingSystem": "All",
      "applicationCategory": "DeveloperApplication",
      "description": "Professional AI Prompt Architect for high-end mobile websites.",
      "offers": {
        "@type": "Offer",
        "price": "0"
      }
    }
    </script>

    <!-- PWA / MOBILE APP SETTINGS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Prominator">
    <meta name="theme-color" content="#0F0E13">
    
    <!-- APP ICONS -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2103/2103633.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2103/2103633.png">

    <!-- WEB MANIFEST (Inline) -->
    <link rel="manifest" id="manifest-link">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0F0E13;
            color: #E6E1E5;
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* SPLASH SCREEN */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease-out, visibility 0.5s;
        }

        .dot {
            width: 15px; height: 15px; border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
            display: inline-block; margin: 0 5px;
        }
        .dot:nth-child(1) { background: #4285F4; animation-delay: -0.32s; }
        .dot:nth-child(2) { background: #EA4335; animation-delay: -0.16s; }
        .dot:nth-child(3) { background: #FBBC05; animation-delay: -0.08s; }
        .dot:nth-child(4) { background: #34A853; }

        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

        /* UI ELEMENTS */
        .glass-card {
            background: rgba(28, 27, 31, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 30px;
        }

        .input-box {
            background: #232127;
            border-radius: 18px;
            padding: 15px;
            border: 2px solid transparent;
            transition: 0.3s;
        }

        .input-box:focus-within {
            border-color: #D0BCFF;
            box-shadow: 0 0 15px rgba(208, 188, 255, 0.2);
        }

        .cta-btn {
            background: linear-gradient(135deg, #D0BCFF 0%, #9370DB 100%);
            color: #1C1B1F;
            font-weight: 800;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        /* PWA INSTALL BANNER */
        #installBanner {
            display: none;
            position: fixed;
            bottom: 25px; left: 20px; right: 20px;
            background: #D0BCFF;
            color: #1C1B1F;
            padding: 18px;
            border-radius: 24px;
            z-index: 2000;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            font-weight: 800;
        }

        #toast {
            visibility: hidden;
            background: #D0BCFF;
            color: #1C1B1F;
            padding: 12px 25px;
            border-radius: 50px;
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        #toast.show { visibility: visible; animation: slideUp 0.3s forwards; }
        @keyframes slideUp { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <!-- GOOGLE STYLE SPLASH -->
    <div id="splash-screen">
        <div>
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <p style="color: #5f6368; font-family: sans-serif; margin-top: 20px; font-weight: bold; letter-spacing: 2px;">PROMINATOR</p>
    </div>

    <!-- PWA INSTALL POPUP -->
    <div id="installBanner">
        <div class="flex items-center gap-3">
            <img src="https://cdn-icons-png.flaticon.com/512/2103/2103633.png" class="w-10 h-10 rounded-lg">
            <span>Install Prominator</span>
        </div>
        <button onclick="triggerInstall()" class="bg-[#1C1B1F] text-white px-5 py-2 rounded-xl text-xs font-black">GET APP</button>
    </div>

    <header class="p-6 flex justify-between items-center sticky top-0 bg-[#0F0E13]/90 backdrop-blur-lg z-50">
        <div>
            <h1 class="text-2xl font-black text-white">PROMINATOR</h1>
            <p class="text-[10px] text-[#D0BCFF] font-bold tracking-[3px]">PREMIUM AI ARCHITECT</p>
        </div>
        <button onclick="toggleSettings()" class="w-12 h-12 rounded-2xl bg-[#1C1B1F] flex items-center justify-center border border-white/10">
            <i class="fas fa-sliders text-[#D0BCFF]"></i>
        </button>
    </header>

    <main class="px-5 mt-4 space-y-6">
        <div class="glass-card p-6 space-y-5">
            <div>
                <label class="text-[11px] font-bold text-[#D0BCFF] uppercase mb-2 block tracking-widest">Mobile App Idea</label>
                <div class="input-box">
                    <textarea id="websiteIdea" rows="3" class="w-full bg-transparent border-none outline-none text-white text-base" placeholder="Ex: A dark mode gym tracker app..."></textarea>
                </div>
            </div>

            <div>
                <label class="text-[11px] font-bold text-[#D0BCFF] uppercase mb-2 block tracking-widest">Specific Styles</label>
                <div class="input-box">
                    <textarea id="userConstraints" rows="2" class="w-full bg-transparent border-none outline-none text-white text-base" placeholder="Ex: Neon purple, glassmorphism, rounded tabs..."></textarea>
                </div>
            </div>

            <button onclick="generatePrompt()" id="mainBtn" class="cta-btn w-full py-5 flex items-center justify-center gap-3 active:scale-95 transition-transform">
                <span id="btnText">CONSTRUCT MOBILE PROMPT</span>
                <div id="loader" class="hidden w-5 h-5 border-2 border-[#1C1B1F] border-t-transparent rounded-full animate-spin"></div>
            </button>
        </div>

        <div id="outputContainer" class="hidden">
            <div class="glass-card overflow-hidden border-[#D0BCFF]/30 border">
                <div class="px-5 py-3 bg-[#D0BCFF]/10 flex justify-between items-center border-b border-white/5">
                    <span class="text-[10px] font-black uppercase text-[#D0BCFF]">Final Architecture</span>
                    <button onclick="copyToClipboard()" class="text-[#D0BCFF] text-xs font-bold"><i class="far fa-copy"></i> COPY</button>
                </div>
                <textarea id="resultText" readonly class="w-full h-80 p-5 font-mono text-[12px] leading-relaxed text-gray-300 bg-transparent outline-none"></textarea>
            </div>
        </div>
    </main>

    <div id="toast">Copied to clipboard!</div>

    <!-- SETTINGS PANEL -->
    <div id="settingsOverlay" class="fixed inset-0 bg-[#0F0E13] z-[60] p-6 transition-transform duration-500 translate-y-full flex flex-col">
        <div class="flex items-center justify-between mb-8">
            <button onclick="toggleSettings()" class="text-2xl text-white"><i class="fas fa-chevron-down"></i></button>
            <h2 class="text-xl font-bold">App Engine Settings</h2>
            <button onclick="clearLogs()" class="text-red-400 text-xs font-bold">WIPE DATA</button>
        </div>
        <div class="glass-card p-5 mb-6">
            <label class="text-xs font-bold text-[#D0BCFF] mb-3 block">OpenRouter Model</label>
            <div class="input-box">
                <input type="text" id="customModel" class="w-full bg-transparent outline-none text-white" value="anthropic/claude-3.5-sonnet">
            </div>
        </div>
        <h3 class="font-bold text-sm text-[#D0BCFF] mb-4 uppercase tracking-widest">Recent Generations</h3>
        <div id="historyList" class="space-y-3 flex-1 overflow-y-auto"></div>
    </div>

    <script>
        // 1. MANIFEST & SERVICE WORKER BLOB (The "Single File" Trick)
        const manifest = {
            "name": "Prominator AI Architect",
            "short_name": "Prominator",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#0F0E13",
            "theme_color": "#0F0E13",
            "icons": [{ "src": "https://cdn-icons-png.flaticon.com/512/2103/2103633.png", "sizes": "512x512", "type": "image/png" }]
        };
        const manifestStr = JSON.stringify(manifest);
        const manifestBlob = new Blob([manifestStr], {type: 'application/json'});
        document.getElementById('manifest-link').setAttribute('href', URL.createObjectURL(manifestBlob));

        // 2. SERVICE WORKER IN-MEMORY
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('fetch', e => { });
            `;
            const swBlob = new Blob([swCode], {type: 'text/javascript'});
            const swUrl = URL.createObjectURL(swBlob);
            navigator.serviceWorker.register(swUrl).catch(e => console.log('SW Error'));
        }

        // 3. INSTALL LOGIC
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBanner').style.display = 'flex';
        });

        async function triggerInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') document.getElementById('installBanner').style.display = 'none';
                deferredPrompt = null;
            }
        }

        // 4. CORE APP LOGIC
        const _k = "c2stb3ItdjEtYjE1YTYwNzA4ZDcwNWE3NzkxNzJjZDY3ZWI3NTkzYjM5MTBhZmVjMWY5NDY4MWFlYWQ0YzdhOWNiZjgzMmRhZQ==";

        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                setTimeout(() => document.getElementById('splash-screen').style.visibility = 'hidden', 500);
            }, 1800);
            renderHistory();
        });

        async function generatePrompt() {
            const idea = document.getElementById('websiteIdea').value;
            const rules = document.getElementById('userConstraints').value;
            const model = document.getElementById('customModel').value;

            if(!idea) return showToast("Enter an idea first!");

            const btn = document.getElementById('mainBtn');
            const loader = document.getElementById('loader');
            btn.disabled = true;
            loader.classList.remove('hidden');

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${atob(_k)}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        "model": model,
                        "messages": [
                            { "role": "system", "content": "You are a professional HTML Architect. Write a massive, detailed prompt for another AI to build a mobile-first, single-file HTML app using Tailwind CSS." },
                            { "role": "user", "content": `Build me a prompt for: ${idea}. Constraints: ${rules}` }
                        ]
                    })
                });

                const data = await response.json();
                const result = data.choices[0].message.content + "\n\nCreate the final HTML code block for mobile now.";
                
                document.getElementById('resultText').value = result;
                document.getElementById('outputContainer').classList.remove('hidden');
                saveLog(idea, result);
                showToast("Architecture Ready!");
            } catch (e) {
                alert("API Error");
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        }

        function saveLog(idea, prompt) {
            let logs = JSON.parse(localStorage.getItem('p_logs') || '[]');
            logs.unshift({ idea, prompt });
            localStorage.setItem('p_logs', JSON.stringify(logs.slice(0,10)));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const logs = JSON.parse(localStorage.getItem('p_logs') || '[]');
            list.innerHTML = logs.map((l, i) => `
                <div class="bg-white/5 p-4 rounded-2xl border border-white/5" onclick="loadLog(${i})">
                    <p class="text-sm truncate text-gray-300 font-bold">${l.idea}</p>
                </div>
            `).join('');
        }

        function loadLog(i) {
            const logs = JSON.parse(localStorage.getItem('p_logs') || '[]');
            document.getElementById('websiteIdea').value = logs[i].idea;
            document.getElementById('resultText').value = logs[i].prompt;
            document.getElementById('outputContainer').classList.remove('hidden');
            toggleSettings();
        }

        function copyToClipboard() {
            navigator.clipboard.writeText(document.getElementById('resultText').value);
            showToast("Copied to Clipboard!");
        }

        function toggleSettings() { document.getElementById('settingsOverlay').classList.toggle('translate-y-full'); }
        
        function showToast(m) {
            const t = document.getElementById('toast');
            t.innerText = m; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function clearLogs() { localStorage.removeItem('p_logs'); renderHistory(); }
    </script>
</body>
</html>
